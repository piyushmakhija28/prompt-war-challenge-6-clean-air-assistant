name: CleanAir Guardian CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute 30+ Triad Invariant Tests
        run: node test/run-tests.js

      - name: Execute 10,000 Property Fuzz Vectors
        run: node test/run-fuzz-tests.js
